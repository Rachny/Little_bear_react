    <script type="text/javascript">
      // GitHub Pages SPA routing fix (pairs with public/404.html).
      // Decodes the redirected path back into a real URL for React Router.
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search.slice(1).split("&").map(function (s) {
            return s.replace(/~and~/g, "&");
          }).join("?");
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })(window.location);
    </script>
