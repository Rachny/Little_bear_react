<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>little-bear</title>
    <script type="text/javascript">
      // GitHub Pages SPA routing fix.
      // Redirects any unknown path (e.g. a page refresh on /Little_bear_react/shop)
      // to index.html, encoding the original path so React Router can restore it.
      var pathSegmentsToKeep = 1; // number of segments in the repo base path, e.g. "Little_bear_react"

      var l = window.location;
      l.replace(
        l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
        l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") + "/?/" +
        l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/").replace(/&/g, "~and~") +
        (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
